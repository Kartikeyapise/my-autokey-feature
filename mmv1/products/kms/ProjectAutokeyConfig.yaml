---
name: 'ProjectAutokeyConfig'
# This resource is currently in public preview.
description: |
  `ProjectAutokeyConfig` is a project-level singleton resource used to configure
  the auto-provisioning flow of CryptoKeys for CMEK at the project level.


  ~> **Note:** ProjectAutokeyConfigs cannot be deleted from Google Cloud Platform.
  Destroying a Terraform-managed ProjectAutokeyConfig will remove it from state but
  *will not delete the resource from the project.*
references:
  guides:
    'Cloud KMS with Autokey': 'https://cloud.google.com/kms/docs/kms-with-autokey'
  api: 'https://cloud.google.com/kms/docs/reference/rest/v1/AutokeyConfig'
docs:
id_format: 'projects/{{project}}/autokeyConfig'
base_url: 'projects/{{project}}/autokeyConfig'
self_link: 'projects/{{project}}/autokeyConfig'
# This is a singleton resource that is already created, so create
# is really an update, and therefore should be PATCHed.
create_url: 'projects/{{project}}/autokeyConfig?updateMask=keyProject,keyProjectResolutionMode'
create_verb: 'PATCH'
update_url: 'projects/{{project}}/autokeyConfig?updateMask=keyProject,keyProjectResolutionMode'
update_verb: 'PATCH'
delete_url: 'projects/{{project}}/autokeyConfig?updateMask=keyProject,keyProjectResolutionMode'
delete_verb: 'PATCH'
import_format:
  - 'projects/{{project}}/autokeyConfig'
timeouts:
  insert_minutes: 20
  update_minutes: 20
  delete_minutes: 20
custom_code:
  post_create: 'templates/terraform/post_create/sleep.go.tmpl'
  post_update: 'templates/terraform/post_create/sleep.go.tmpl'
  test_check_destroy: 'templates/terraform/custom_check_destroy/kms_project_autokey_config.go.tmpl'
# Using a handwritten sweeper because of pre_delete.
exclude_sweeper: true
include_in_tgc_next_DO_NOT_USE: true
examples:
  - name: 'kms_project_autokey_config_basic'
    primary_resource_id: 'example-project-autokeyconfig'
    # test depends upon google_project_service_identity service which is still in beta, so we need to keep test limited to beta
    min_version: 'beta'
    vars:
      project_name: 'key-proj'
      key_project_name: 'key-proj-target'
    test_env_vars:
      org_id: 'ORG_ID'
      billing_account: 'BILLING_ACCT'
    external_providers: ["random", "time"]
parameters:
properties:
  - name: 'keyProject'
    type: String
    description: |
      The target key project for this project where KMS Autokey will provision a
      CryptoKey for any new KeyHandle the Developer creates. Should have the form
      `projects/<project_id_or_number>`.
  - name: 'keyProjectResolutionMode'
    type: Enum
    description: |
      The resolution mode for key project selection. Determines how the key project
      is resolved for resources within this project.
    enum_values:
      - 'KEY_PROJECT_RESOLUTION_MODE_UNSPECIFIED'
      - 'USE_FOLDER_CONFIG'
      - 'USE_PROJECT_CONFIG'
  - name: 'etag'
    type: String
    description: 'The etag of the ProjectAutokeyConfig for optimistic concurrency control.'
    output: true
